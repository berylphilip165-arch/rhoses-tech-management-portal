<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Parent Portal</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

<header>

    <h1>Parent Portal</h1>

    <button onclick="logout()">
        Logout
    </button>

</header>

<main>

    <h2>My Children</h2>

    <div id="children"></div>

</main>

<script>

async function loadDashboard() {

    const response =
        await fetch("/api/parent/dashboard");

    if (!response.ok) {

        window.location.href = "/";

        return;
    }

    const data =
        await response.json();

    const container =
        document.getElementById("children");

    container.innerHTML = "";

    data.children.forEach(function(child) {

        const div =
            document.createElement("div");

        div.className = "school";

        div.innerHTML = `
            <h3>
                ${child.first_name}
                ${child.last_name}
            </h3>

            <p>
                School:
                ${child.school_name}
            </p>

            <p>
                Admission Number:
                ${child.admission_number}
            </p>

            <p>
                Class:
                ${child.class_name || ""}
            </p>
        `;

        container.appendChild(div);

    });

}

async function logout() {

    await fetch("/api/logout", {
        method: "POST"
    });

    window.location.href = "/";

}

loadDashboard();

</script>

</body>
</html>
